<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Entrar</title>
</head>
<body>
    <div layout:fragment="conteudo">
        <h2>Entrar</h2>

        <p class="mensagem mensagem-erro" th:if="${param.erro}">E-mail ou senha inválidos.</p>
        <p class="mensagem mensagem-erro" th:if="${param.bloqueado}">Muitas tentativas. Tente novamente em alguns minutos.</p>
        <p class="mensagem mensagem-sucesso" th:if="${param.logout}">Você saiu do sistema.</p>

        <form th:action="@{/login}" method="post">
            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required="required" autofocus="autofocus">
            </div>
            <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required="required">
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
