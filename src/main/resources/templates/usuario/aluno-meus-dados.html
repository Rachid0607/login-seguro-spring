<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Meus dados</title>
</head>
<body>
    <div layout:fragment="conteudo">
        <div class="page-header">
            <h1>Meus dados</h1>
            <p>Informações da sua conta.</p>
        </div>

        <div class="card">
            <div class="perfil-detalhe">
                <div class="perfil-item">
                    <span>Nome</span>
                    <strong th:text="${usuario.nome}">Nome</strong>
                </div>
                <div class="perfil-item">
                    <span>E-mail</span>
                    <strong th:text="${usuario.username}">email</strong>
                </div>
                <div class="perfil-item">
                    <span>Perfil</span>
                    <strong>
                        <span class="badge" th:class="'badge badge-perfil-' + ${#strings.toLowerCase(usuario.perfil)}" th:text="${usuario.perfil}">PERFIL</span>
                    </strong>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
