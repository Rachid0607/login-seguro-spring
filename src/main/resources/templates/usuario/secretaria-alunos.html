<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Alunos</title>
</head>
<body>
    <div layout:fragment="conteudo">
        <div class="page-header">
            <h1>Alunos</h1>
            <p>Lista somente leitura dos alunos cadastrados.</p>
        </div>

        <div class="card">
            <div class="empty-state" th:if="${#lists.isEmpty(alunos)}">
                <p>Nenhum aluno cadastrado ainda.</p>
            </div>
            <div class="tabela-scroll" th:unless="${#lists.isEmpty(alunos)}">
                <table class="table">
                    <thead>
                        <tr><th>Nome</th><th>E-mail</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="aluno : ${alunos}">
                            <td th:text="${aluno.nome}">Nome</td>
                            <td th:text="${aluno.email}">email</td>
                            <td>
                                <span class="badge" th:class="${aluno.ativo} ? 'badge badge-ativo' : 'badge badge-inativo'"
                                      th:text="${aluno.ativo} ? 'Ativo' : 'Inativo'">Status</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
