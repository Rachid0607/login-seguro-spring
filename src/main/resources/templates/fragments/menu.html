<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="menu" class="menu">
        <a th:href="@{/}">Início</a>
        <a th:href="@{/admin/usuarios}" sec:authorize="hasRole('ADMINISTRADOR')">Administração</a>
        <a th:href="@{/secretaria/alunos}" sec:authorize="hasRole('SECRETARIA')">Alunos</a>
        <a th:href="@{/aluno}" sec:authorize="hasRole('ALUNO')">Meus dados</a>
        <a th:href="@{/login}" sec:authorize="isAnonymous()">Entrar</a>
        <a th:href="@{/cadastro}" sec:authorize="isAnonymous()">Cadastrar</a>
        <span sec:authorize="isAuthenticated()" sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="display:inline">
            <button type="submit">Sair</button>
        </form>
    </nav>
</body>
</html>
