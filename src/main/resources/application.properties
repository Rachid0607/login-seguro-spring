spring.application.name=LoginSeguro

# Desativa o cache de templates em desenvolvimento (revisar antes de produção)
spring.thymeleaf.cache=false

# Nome e tema visual da aplicacao, sobrepostos pelas variaveis de ambiente
# APP_NOME e APP_TEMA (ex.: para adaptar ao tema de outro projeto sem mudar codigo).
# Temas disponiveis: padrao, escuro (ver static/temas/).
app.nome=${APP_NOME:Login Seguro}
app.tema=${APP_TEMA:padrao}

# Dominio de e-mail exigido no cadastro publico (vazio = qualquer dominio).
# Ex.: alunos.umc.br (com ou sem "@", funciona dos dois jeitos).
app.cadastro.dominio-email=${APP_CADASTRO_DOMINIO_EMAIL:}

# Carrega variaveis locais de um arquivo .env (formato de .properties), se existir.
# O arquivo .env nunca e versionado (ver .gitignore); use .env.example como modelo.
spring.config.import=optional:file:.env[.properties]

# Conexao com o MongoDB Atlas. A URI so vem de variavel de ambiente (MONGODB_URI),
# nunca e definida aqui, para nao expor credenciais em arquivo versionado.
# A partir do Spring Boot 4, essas propriedades de conexao vivem em spring.mongodb.*
# (spring.data.mongodb.uri/database foram descontinuadas e nao sao mais aplicadas).
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:login_seguro}

# Garante que os indices declarados nos documentos (@Indexed, @CompoundIndex etc.)
# sejam criados automaticamente na subida da aplicacao.
spring.data.mongodb.auto-index-creation=true
